<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead CRM | AI Lead Scoring</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="container">
        <header>
            <div class="logo" data-text="Lead CRM">
                <span class="logo-text">Lead<span style="color:var(--text)"> CRM</span></span>
                <span class="logo-subtitle">INTELLIGENT LEAD MANAGEMENT</span>
            </div>
            <nav>
                <a href="{{ url_for('index') }}">
                    <i class="fa-solid fa-home"></i> Home
                </a>
                <a href="{{ url_for('view_leads') }}">
                    <i class="fa-solid fa-users"></i> All Leads
                </a>
                <a href="{{ url_for('bulk_upload') }}">
                    <i class="fa-solid fa-upload"></i> Bulk Upload
                </a>
            </nav>
            <div class="user-profile">
                <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
                    <i class="fa-solid fa-moon" id="theme-icon"></i>
                </button>
                <i class="fa-regular fa-bell" style="cursor: pointer; font-size: 1.2rem;"></i>
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Admin" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary);">
            </div>
        </header>

        {% block content %}{% endblock %}

        <footer style="margin-top: 4rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
            &copy; 2026 Lead CRM • Created by Yashvi Nagar
        </footer>
    </div>

    <script>
        // Theme Toggle Functionality
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            const icon = document.getElementById('theme-icon');
            
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            // Update icon
            if (newTheme === 'light') {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }

        // Load saved theme on page load
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            const icon = document.getElementById('theme-icon');
            
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            if (savedTheme === 'light') {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
        });
    </script>
</body>
</html>
